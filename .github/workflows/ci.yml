name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'images/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'images/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSVC ${{ matrix.config }} (engine ON)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}

      # The engine is compiled and linked (never started: the runner has no GPU or display). No generator is
      # named, so CMake picks the newest Visual Studio installed on the runner image.
      - name: Configure
        run: cmake -S . -B build -A x64 -DESTREE_BUILD_ENGINE=ON "-DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.fetchcontent" -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-${{ matrix.config }}
          path: |
            build/Testing/Temporary/*.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  linux:
    name: Linux GCC Release (engine ${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # ON: the full engine executable is compiled and linked (never run: no display).
        # OFF: only the standalone targets (treegen, treegen_cli) and their tests.
        engine: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install engine dependencies
        if: matrix.engine == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - name: Cache FetchContent downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure (engine ON)
        if: matrix.engine == 'ON'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DESTREE_BUILD_ENGINE=ON "-DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.fetchcontent" -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure (engine OFF)
        if: matrix.engine == 'OFF'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DESTREE_BUILD_ENGINE=OFF "-DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.fetchcontent" -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux-engine-${{ matrix.engine }}
          path: |
            build/Testing/Temporary/*.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
